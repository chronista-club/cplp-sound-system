[workspace]
members = [
    "crates/cplp-core",
    "crates/cplp-audio",
    "crates/cplp-network",
    "crates/cplp-session",
    "crates/cplp-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"

[workspace.dependencies]
# 内部クレート
cplp-core = { path = "crates/cplp-core" }
cplp-audio = { path = "crates/cplp-audio" }
cplp-network = { path = "crates/cplp-network" }
cplp-session = { path = "crates/cplp-session" }

# 非同期ランタイム
tokio = { version = "1", features = ["full"] }

# シリアライゼーション
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# エラーハンドリング
anyhow = "1"
thiserror = "2"

# オーディオ
cpal = "0.15"
clack-host = { git = "https://github.com/prokopyl/clack", features = ["libloading"] }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = ["clack-host", "audio-ports", "note-ports", "gui", "raw-window-handle_06"] }

# GUI ウィンドウ
winit = "0.30"
clack-finder = { git = "https://github.com/prokopyl/clack" }

# Lock-free データ構造
ringbuf = "0.4"

# MIDI
midir = "0.10"

# ロギング
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
