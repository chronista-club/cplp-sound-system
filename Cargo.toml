[workspace]
members = [
    "crates/cplp-core",
    "crates/cplp-audio",
    "crates/cplp-network",
    "crates/cplp-session",
    "crates/cplp-app",
    "crates/cplp-lobby",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"

[workspace.dependencies]
# 内部クレート
cplp-core = { path = "crates/cplp-core" }
cplp-audio = { path = "crates/cplp-audio" }
cplp-network = { path = "crates/cplp-network" }
cplp-session = { path = "crates/cplp-session" }

# 非同期ランタイム
tokio = { version = "1", features = ["full"] }

# シリアライゼーション
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# エラーハンドリング
anyhow = "1"
thiserror = "2"

# オーディオ
cpal = "0.15"
clack-host = { git = "https://github.com/prokopyl/clack", features = ["libloading"] }
clack-extensions = { git = "https://github.com/prokopyl/clack", features = ["clack-host", "audio-ports", "note-ports", "gui", "raw-window-handle_06"] }

# GUI ウィンドウ
winit = "0.30"
clack-finder = { git = "https://github.com/prokopyl/clack" }

# P2P 通信
unison = { git = "https://github.com/chronista-club/unison.git" }

# Lock-free データ構造
ringbuf = "0.4"

# MIDI
midir = "0.10"

# ロギング
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# HTTP サーバー
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# データベース
surrealdb = { version = "2", features = ["kv-mem"] }

# 認証
oauth2 = "5"
jsonwebtoken = "9"

# HTTP クライアント
reqwest = { version = "0.12", features = ["json"] }

# WebSocket クライアント
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# ユーティリティ
uuid = { version = "1", features = ["v4"] }
url = "2"
