[tasks.app]
description = "HUD を起動（release build + debug ログ出力）"
run = """
cargo build --release --bin cplp --quiet
CPLP_LOG=dev ./target/release/cplp hud --log-file /tmp/cplp-hud.log
"""

[tasks."app:bg"]
description = "HUD をバックグラウンド起動（JSON ログ監視用）"
run = """
cargo build --release --bin cplp --quiet
CPLP_LOG=dev ./target/release/cplp hud --log-file /tmp/cplp-hud.log &
echo "PID: $!"
echo "Log: /tmp/cplp-hud.log (JSON Lines)"
"""

[tasks."mac:build"]
description = "macOS アプリをビルド（cargo + xcodebuild）"
run = """
cargo build --release -p cplp-ffi --quiet
cd apps/macos && xcodebuild -project CplpMac.xcodeproj -scheme CplpMac -configuration Debug build 2>&1 | tail -3
"""

[tasks."mac:run"]
description = "macOS アプリをビルドして起動"
run = """
cargo build --release -p cplp-ffi --quiet
cd apps/macos && xcodebuild -project CplpMac.xcodeproj -scheme CplpMac -configuration Debug build 2>&1 | tail -3
open ~/Library/Developer/Xcode/DerivedData/CplpMac-*/Build/Products/Debug/CPLP\\ Sound\\ System.app
"""
