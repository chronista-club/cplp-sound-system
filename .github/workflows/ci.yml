name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # unison は相対パス依存（../unison）— ワークスペース外には checkout 不可なので
      # git clone + symlink で解決
      - name: Clone unison dependency
        run: |
          git clone --depth 1 https://github.com/chronista-club/unison.git .unison-dep
          ln -s "$GITHUB_WORKSPACE/.unison-dep" ../unison

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ALSA ヘッダー（cpal ビルドに必要）
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone unison dependency
        run: |
          git clone --depth 1 https://github.com/chronista-club/unison.git .unison-dep
          ln -s "$GITHUB_WORKSPACE/.unison-dep" ../unison

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo fmt も cargo metadata で unison パスを解決する必要がある
      - name: Clone unison dependency
        run: |
          git clone --depth 1 https://github.com/chronista-club/unison.git .unison-dep
          ln -s "$GITHUB_WORKSPACE/.unison-dep" ../unison

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone unison dependency
        run: |
          git clone --depth 1 https://github.com/chronista-club/unison.git .unison-dep
          ln -s "$GITHUB_WORKSPACE/.unison-dep" ../unison

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
