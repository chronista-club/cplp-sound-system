name: CplpSoundSystem
options:
  bundleIdPrefix: tech.anycreative.cplp
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CplpSoundSystem:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Resources/Assets.xcassets
        buildPhase: resources
    resources:
      - path: Resources/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.anycreative.cplp.soundsystem
        PRODUCT_NAME: "CPLP Sound System"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.2.0"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 3EQKG4B352
        ENABLE_APP_SANDBOX: false
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # cplp-ffi リンク設定
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../../target/release"
          - "$(PROJECT_DIR)/../../target/debug"
          - "$(inherited)"
        OTHER_LDFLAGS:
          - "-lcplp_ffi"
          - "-lc++"
          - "-framework CoreAudio"
          - "-framework AudioToolbox"
          - "-framework CoreMIDI"
          - "-framework CoreFoundation"
          - "-framework Carbon"
          - "-framework Metal"
          - "-framework QuartzCore"
          - "-framework IOKit"
          - "-framework AppKit"
          - "-lresolv"
        # CplpBridge モジュール（C ヘッダー）
        SWIFT_INCLUDE_PATHS:
          - "$(PROJECT_DIR)/CplpBridge"
        # Hardened Runtime（App Store / 公証 必須）
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: Resources/CplpSoundSystem.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
