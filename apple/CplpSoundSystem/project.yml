name: CplpSoundSystem
options:
  bundleIdPrefix: tech.anycreative
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CplpSoundSystem:
    type: application
    platform: macOS
    sources:
      - path: Sources/macOS
        type: group
      - path: Sources/Shared
        type: group
    resources:
      - path: Resources/Info.plist
        buildPhase: none
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.anycreative.CplpSoundSystem
        PRODUCT_NAME: CplpSoundSystem
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 3EQKG4B352
        ENABLE_APP_SANDBOX: false
        SWIFT_EMIT_LOC_STRINGS: true
        # cplp-ffi リンク設定
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../../target/release"
        OTHER_LINKER_FLAGS:
          - "-lcplp_ffi"
        # CplpBridge モジュール（C ヘッダー）
        SWIFT_INCLUDE_PATHS:
          - "$(PROJECT_DIR)/CplpBridge"
        # Hardened Runtime（App Store 必須）
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: Resources/CplpSoundSystem.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
