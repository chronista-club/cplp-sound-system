[package]
name = "cplp-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "cplp-sound-system CLI アプリケーション"

[[bin]]
name = "cplp"
path = "src/main.rs"

[dependencies]
cplp-core.workspace = true
cplp-audio.workspace = true
cplp-network.workspace = true
cplp-session.workspace = true
cplp-hud = { path = "../../crates/cplp-hud" }
cplp-flux = { path = "../../crates/cplp-flux" }
cplp-plug-looper = { path = "../../crates/cplp-plug-looper" }
cplp-scene = { path = "../../crates/cplp-scene" }
triple_buffer.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap = { version = "4", features = ["derive"] }
jsonwebtoken.workspace = true
serde_json.workspace = true
reqwest.workspace = true
