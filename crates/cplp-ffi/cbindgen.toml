# cbindgen 設定 — cplp-ffi
#
# 使い方:
#   cbindgen --config crates/cplp-ffi/cbindgen.toml \
#            --crate cplp-ffi \
#            --output apple/CplpSoundSystem/CplpBridge/cplp_ffi.h
#
# build-app.sh の中でも自動実行される。

language = "C"
header = "/* cplp-ffi — auto-generated by cbindgen. DO NOT EDIT. */"
include_guard = "CPLP_FFI_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify manually. */"
tab_width = 4
style = "both"
cpp_compat = true

# Swift から直接インポートするために documentation = true
documentation = true
documentation_style = "c99"
documentation_length = "full"

[defines]

[export]
prefix = ""
include = []
exclude = []

[export.rename]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
rename_args = "None"

[struct]
rename_fields = "None"

[parse]
parse_deps = false
